name: Desktop installers

# Builds Windows (.msi, .exe) and macOS (.dmg) installers and attaches them to a GitHub Release.
# Runs on every push to main that changes the calculator, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "en/**"
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-14
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install and prepare
        run: |
          npm install
          npm run prepare-dist

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "Oracle TCO Kalkulator v__VERSION__ (desktop)"
          releaseBody: |
            Instalacije za Windows i macOS. Verzije nisu potpisane:
            - Windows: na upozorenje "Windows protected your PC" kliknite "More info" pa "Run anyway".
            - macOS: posle prvog pokušaja otvorite System Settings > Privacy & Security i kliknite "Open Anyway".

            Installers for Windows and macOS. Builds are unsigned:
            - Windows: on "Windows protected your PC", click "More info", then "Run anyway".
            - macOS: after the first attempt, open System Settings > Privacy & Security and click "Open Anyway".
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
